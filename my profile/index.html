
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #dbeafe, #fce7f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-card {
            background-color: white;
            width: 380px;
            padding: 35px 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #8b45c6;
            margin-bottom: 15px;
            font-size: 28px;
        }

        h2 {
            color: #c05a91;
            font-size: 20px;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        h3 {
            color: #333;
            margin-bottom: 12px;
        }

        .skills {
            color: #315b9b;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 25px;
        }

        button {
            background-color: #9146e8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #6f2dbd;
            transform: scale(1.05);
        }

        #message {
            color: green;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 450px) {
            .profile-card {
                width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <h1>My Profile</h1>

        <h2>Sonu Birendra Yadav</h2>

        <p>
            Hello! I am a final-year B.Tech Information Technology
            student. I am passionate about learning new technologies
            and developing my programming skills.
        </p>

        <h3>My Skills</h3>

        <div class="skills">
            HTML | CSS | JavaScript | Java | SQL
        </div>

        <button onclick="showMessage()">Click Me</button>

        <p id="message">
            Thank you for visiting my profile! 😊
        </p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
